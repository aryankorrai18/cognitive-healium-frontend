<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognitive Healium - Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; max-width: 600px; margin: 0 auto; }
    input { padding: 10px; font-size: 16px; width: 300px; border: 2px solid #ccc; border-radius: 6px; display: block; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px 5px 5px 0; cursor: pointer; border-radius: 6px; border: none; background: #1976d2; color: white; }
    button:hover { background: #1565c0; }
    #result { margin-top: 20px; font-size: 18px; color: #2e7d32; min-height: 30px; padding: 10px; background: #e8f5e9; border-radius: 6px; }
    .error-msg { color: #d32f2f; font-size: 14px; margin-top: 5px; display: none; }
    .nav-bar { display: flex; gap: 15px; margin-bottom: 20px; padding: 10px; background: #e0e0e0; border-radius: 6px; }
    .nav-bar a { text-decoration: none; color: #333; font-weight: bold; }
    .nav-bar a:hover { color: #1976d2; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="#home" id="nav-home-v2">Home</a>
    <a href="#products" id="nav-products-v2">Products</a>
    <a href="#contact" id="nav-contact-v2">Contact</a>
  </div>

  <h2>Healium Test Page</h2>

  <!-- Scenario 1: ID renamed (search-input -> search-bar-v3) -->
  <div class="card">
    <h3>Product Search</h3>
    <input
      id="search-bar-v3"
      class="search-bar"
      name="q"
      placeholder="Search products..."
      type="text"
    />
    <button id="search-btn" onclick="doSearch()">Search</button>
    <div id="result"></div>
  </div>

  <!-- Scenario 2: ID removed, only class remains -->
  <div class="card">
    <h3>Newsletter Signup</h3>
    <input
      class="email-input"
      name="email"
      placeholder="Enter your email..."
      type="email"
    />
    <button class="subscribe-btn" onclick="doSubscribe()">Subscribe</button>
    <span id="subscribe-status"></span>
  </div>

  <!-- Scenario 3: Element wrapped in new container -->
  <div class="card">
    <div class="form-wrapper">
      <div class="input-container">
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="Enter username" type="text" />
      </div>
    </div>
    <button id="login-btn" onclick="doLogin()">Login</button>
    <span id="login-status"></span>
  </div>

  <!-- Scenario 4: Dynamic IDs with random suffixes -->
  <div class="card">
    <h3>Recent Orders</h3>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr id="order-row-84729" onclick="window.rowClicked='ORD-2024-001'">
          <td class="order-id">ORD-2024-001</td>
          <td>$49.99</td>
        </tr>
        <tr id="order-row-99201" onclick="window.rowClicked='ORD-2024-002'">
          <td class="order-id">ORD-2024-002</td>
          <td>$129.99</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    function doSearch() {
      const val = document.querySelector('input[name="q"]').value;
      document.getElementById('result').textContent =
        val ? 'Searched for: ' + val : 'Empty search';
    }

    function doSubscribe() {
      const email = document.querySelector('input[name="email"]').value;
      document.getElementById('subscribe-status').textContent =
        email ? 'Subscribed: ' + email : 'Enter an email';
    }

    function doLogin() {
      const user = document.getElementById('username').value;
      document.getElementById('login-status').textContent =
        user ? 'Welcome, ' + user + '!' : 'Enter username';
    }
  </script>
</body>
</html>
