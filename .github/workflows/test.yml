name: Cognitive Healium CI

on:
  push:
    branches: [main] # fires on every push to main, regardless of which files changed
  workflow_run:
    workflows: ["Deploy Frontend to GitHub Pages"]
    types:
      - completed
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  HEALIUM_SDK_REPO: "https://github.com/aryankorrai18/cognitive-healium-backend.git"

jobs:
  test-live-production:
    name: Production E2E Test (Live Site)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Cognitive Healium SDK and test dependencies
        run: |
          pip install --upgrade pip
          pip install "cognitive-healium @ git+${{ env.HEALIUM_SDK_REPO }}"
          pip install pytest pytest-playwright
          playwright install chromium --with-deps

      # ===============================================================
      # 🟢 CHANGE 1: Added --log-cli-level=INFO to print HEALED logs
      # 🟢 CHANGE 2: Added tee to save logs to test_output.log
      # ===============================================================
      - name: Run All Healing Tests (Capture AI Healing Logs)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          DEPLOYED_URL: https://aryankorrai18.github.io/cognitive-healium-frontend/
        run: |
          pytest tests/ -v --tb=short --healium-enabled -s --log-cli-level=INFO 2>&1 | tee test_output.log
        # 👆 'tee' writes to the file AND shows it in real-time in the CI console

      # ===============================================================
      # 🟢 CHANGE 3: Upload the log file as an artifact (even if tests fail)
      # ===============================================================
      - name: 📤 Upload Healing Audit Logs
        if: always() # Upload even if a test fails, so you can see what healed
        uses: actions/upload-artifact@v4
        with:
          name: healium-ci-audit-logs
          path: test_output.log
